[project]
name = "victorian-ride"
version = "0.1.0"
description = "Drive a hansom cab in a Victorian market town on a sim-racing rig: the wheel is the reins."
requires-python = ">=3.12,<3.13"
dependencies = [
    "raylib>=5.5",
    "pysdl2>=0.9.16",
    "pysdl2-dll>=2.30",
    "sounddevice>=0.5",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
victorian-ride = "victorian_ride.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/victorian_ride"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
